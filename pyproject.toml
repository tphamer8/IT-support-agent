  [project]
  name = "it-support-agent"
  version = "0.1.0"
  description = "A learning project for an IT support chatbot using LangChain and LangGraph."
  requires-python = ">=3.11"
  dependencies = [
      "langchain",
      "langchain-ollama",
      "langchain-community",
      "chromadb",
      "python-dotenv",
  ]

  [build-system]
  requires = ["setuptools>=68"]
  build-backend = "setuptools.build_meta"